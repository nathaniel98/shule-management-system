name: Deploy school staff authentication functions to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/create-school-staff-user/**"
      - "supabase/functions/list-school-teachers/**"
      - "supabase/functions/school-admin-login/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy create-school-staff-user
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-school-staff-user --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --yes

      - name: Deploy list-school-teachers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy list-school-teachers --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --yes

      - name: Deploy school-admin-login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy school-admin-login --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --yes
